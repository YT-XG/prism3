[package]
name = "prism3"
version = "0.1.0"
description = "Prism3 desktop application"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prism3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# 开机自启：只在 Rust 侧调用（见 autostart.rs），不给前端开 JS 权限，
# 因此 capabilities 无需改动。
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }
thiserror = "2"
log = "0.4"
# 蓝牙 LE（StarRing Ultra 耳机）：跨平台 BLE 客户端。会话线程自带 current-thread 运行时，
# 因此 tokio 只需 rt/sync/time/macros，不需要 net / 多线程调度器；tokio-stream 只用来
# 轮询 btleplug 的通知流（`StreamExt::next`），uuid 用来表达特征 UUID 常量。
# 三者都落在 btleplug 已有的依赖上，不引入新的 crate。
btleplug = "0.13.5"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-stream = "0.1"
uuid = "1"
# 剪贴板历史：`arboard` 读写系统剪贴板（文本 + 图片）；`image` 负责图片的 PNG 编解码与
# 缩略图（arboard 的 `image-data` 默认特性本来就会引入 `image`，这里直接用，不额外增重）。
arboard = "3.7"
image = "0.25"

# 统一存储（见 db.rs）：速记（笔记正文 + 元数据）与剪贴板历史都进这一个 SQLite 库。
# `bundled` = 自带 SQLite C 源码（MSVC 下经 cc → cl.exe 本地编译，不依赖系统 sqlite3.dll，
# NSIS 打包干净）；`backup` 与 x-hub 对齐版本特性。
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
# 笔记图片导入：前端传 base64，后端解码落盘（现有 clipboard.rs 只手写了编码侧）。
base64 = "0.22"

# 自动更新（见 updater.rs）：阻塞式 HTTP 下载安装包，Windows 上 native-tls 走系统
# schannel（不引入 OpenSSL；也不启用 reqwest 默认的 rustls/aws-lc-rs，避免 NASM/CMake）。
# `sha2` 校验安装包，`semver` 比较版本（semver 本来就是 tauri-utils 的传递依赖）。
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls",
    "blocking",
    "system-proxy",
] }
sha2 = "0.10"
semver = "1"

# Windows 专用：DXGI 枚举显卡（型号 + 专用显存），WMI 查询主板/整机/内存条；
# WindowsAndMessaging 用于把窗口位置与尺寸合并成一次 SetWindowPos（见 commands.rs）；
# DataExchange 读剪贴板序列号/格式/数据块、开合剪贴板，Memory 锁住那块 HGLOBAL
# （剪贴板历史自己解 CF_DIB —— arboard 只认 CF_DIBV5，见 clipboard.rs 的 capture 模块），
# Gdi 把只有 CF_BITMAP 的图片经 GetDIBits 转成像素，Input_KeyboardAndMouse 发 Ctrl+V，
# Threading 取当前线程 id（焦点归还时的 AttachThreadInput）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
wmi = "0.17"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
