# 预热 Rust 缓存（只跑在默认分支 master 上）。
#
# 为什么需要这个文件：GitHub Actions 的缓存**按 ref 作用域**——tag 上保存的缓存只有那个
# tag 自己能读，下一个 tag（v0.3.13 → v0.4.0）永远读不到，于是每次发版都从零编译
# ~11–14 分钟，再花 ~3 分钟把缓存上传给「下一个永远不会读它的 tag」。
# 而默认分支（master）的缓存**对所有 ref 可见**，tag 构建也能读。
# 所以：缓存由这里在 master 上维护，release.yml 只读不写。
#
# 触发：只改 Rust / 锁文件时才跑，避免前端小改动也去编译一遍。
name: warm-rust-cache

on:
  push:
    branches: [master]
    paths:
      - "src-tauri/**"
      - ".github/workflows/warm-rust-cache.yml"
  workflow_dispatch:

concurrency:
  group: warm-rust-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    name: Warm release cache
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 与 release.yml 保持一致；两边不同会让 key 对不上、缓存白存。
          shared-key: prism3-release

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 必须先构建前端：`generate_context!` 在编译期读 frontendDist，
      # 没有 dist 目录时 cargo build 会直接失败。
      - name: Build frontend
        run: pnpm build

      - name: Build release (warms target/)
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
